name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        working-directory: compiler
        run: node --experimental-strip-types test/run.ts

      - name: Run the examples
        working-directory: compiler
        shell: bash
        run: |
          for f in ../examples/*.hk; do
            echo "--- $f"
            node bin/halka.mjs run "$f"
          done

      - name: Check that everything is formatted
        working-directory: compiler
        run: node bin/halka.mjs fmt --check ../examples ../stdlib ../packages test/cases test/native

      # The registry's index is derived from the archives beside it, so an
      # index edited by hand -- or a submission whose index was never
      # rebuilt -- is a registry that lies about its own contents.
      - name: Check the registry index matches its archives
        working-directory: compiler
        run: node bin/halka.mjs pkg index ../docs/registry --check

      - name: Check STATUS.md's counts match its own table
        if: runner.os == 'Linux'
        run: node tools/status-counts.mjs --check

      - name: Run each package's own tests
        working-directory: compiler
        shell: bash
        run: |
          for d in ../packages/*/; do
            echo "-- $(basename "$d")"
            HALKA_PATH="$(cd "$d/src" && pwd)" node bin/halka.mjs test "$d/test" || exit 1
          done

      - name: Compile the benchmarks natively and check they agree
        working-directory: compiler
        shell: bash
        run: |
          node bin/halka.mjs toolchain
          for f in ../bench/fib.hk ../bench/mandel.hk ../bench/parallel.hk; do
            node bin/halka.mjs build --release "$f" -o "/tmp/$(basename "$f" .hk)" || exit 1
          done
          echo "native builds ok"

  typecheck:
    name: typecheck the toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - working-directory: compiler
        run: npm ci --no-audit --no-fund
      - working-directory: compiler
        run: npx tsc -p tsconfig.json --noEmit

  spec:
    name: spec is unmodified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate the locked spec from its .docx sources
        run: |
          python spec/tools/gen_spec.py \
            spec/source/HALKA_V49_Syntax_Design_1-15_Locked.docx \
            spec/source/HALKA_V49_Syntax_Design_16-34_Locked.docx \
            spec/source/HALKA_V49_Syntax_Design_35-54_Locked.docx > /tmp/rules.md
      - name: Fail if the locked rules drifted from the authored documents
        run: |
          # The header is hand-written; the rules below it must match byte for byte.
          # 22 lines of header: the HTML comment, the title, and the status line.
          tail -n +23 spec/V49-LOCKED.md > /tmp/have.md
          if ! diff -q <(sed -e 's/[[:space:]]*$//' /tmp/rules.md) \
                       <(sed -e 's/[[:space:]]*$//' /tmp/have.md) > /dev/null; then
            echo "::error::spec/V49-LOCKED.md no longer matches spec/source/*.docx."
            echo "The locked rules may only change through a numbered HEP."
            diff <(sed -e 's/[[:space:]]*$//' /tmp/rules.md) \
                 <(sed -e 's/[[:space:]]*$//' /tmp/have.md) | head -40
            exit 1
          fi

  grammar:
    name: tree-sitter grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - working-directory: editors/tree-sitter-halka
        run: npm install --no-audit --no-fund

      - name: Generate the parser and fail on any conflict
        working-directory: editors/tree-sitter-halka
        run: npx tree-sitter generate

      - name: Fail if src/parser.c is stale
        working-directory: editors/tree-sitter-halka
        run: git diff --exit-code -- src/

      - name: Corpus tests
        working-directory: editors/tree-sitter-halka
        run: npx tree-sitter test

      - name: Parse every example
        working-directory: editors/tree-sitter-halka
        run: npx tree-sitter parse --quiet --stat ../../examples/*.hk ../../compiler/test/cases/*.hk

  vscode:
    name: vscode extension packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - working-directory: editors/vscode
        run: npm install --no-audit --no-fund
      - working-directory: editors/vscode
        run: npx vsce package --out halka.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: halka-vscode-extension
          path: editors/vscode/halka.vsix
